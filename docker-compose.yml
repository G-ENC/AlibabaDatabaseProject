# Start everything with:  docker compose up --build
# Then open http://localhost
# Reset the database to the sample data:  docker compose down -v && docker compose up --build
services:
  web:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: ./server
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgres://app:${DB_PASSWORD:-app}@db:5432/marketplace
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: marketplace
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro # schema + sample data, run on first start only
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only (psql, pgAdmin, npm run dev), never from the internet
    healthcheck:
      # -h 127.0.0.1: the temporary server used while init scripts run listens on no TCP port,
      # so the check only passes once the schema and seed data are loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d marketplace"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
