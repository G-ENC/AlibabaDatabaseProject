# Start everything with:  docker compose up --build
# Then open http://localhost
services:
  web:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: ./server
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # DATABASE_URL: postgres://app:app@db:5432/marketplace   # used once the db service below is enabled
